<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" role="img" aria-label="Data sources feed production tables; LightGBM production forecasts feed the CO2 table; LightGBM and neural models read that table and write the same forecast table, which is scored." font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
