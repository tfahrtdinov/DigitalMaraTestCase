<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" role="img" aria-label="One model run: data is split by time, LightGBM or a neural model is trained, a 168-hour forecast is scored, and settings, losses and scores are written through the Logger protocol to the console or MLflow." font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
