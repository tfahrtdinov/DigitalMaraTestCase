<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 712" width="1100" height="712" role="img" aria-label="LightGBM and the neural network follow the same training scheme: config and data, a fit for each period on the past only, a forecast, one shared forecast table and scoring. Below: the training, search, validation and test periods of each model." font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
