[project]
name = "co2-forecast"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.108",
    "icechunk>=2.3.1",
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "pystac>=1.15.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsforecast>=2.0.1",
    "statsmodels>=0.15.0",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[project.optional-dependencies]
# neural baselines (src/trainer.py, src/models/neural): uv sync --extra neural
neural = ["torch>=2.15.0"]

# Linux gets the CPU build of torch: the PyPI wheels there pull the CUDA stack (several GB).
# macOS keeps the PyPI wheel, which is CPU/MPS already.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["outdated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
exclude = ["outdated"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
