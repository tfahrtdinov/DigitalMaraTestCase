# MLflow tracking server plus two training images built from uv.lock (Dockerfile).
#   docker compose up -d                                   -> MLflow UI at http://localhost:5001
#   docker compose run --rm train lgbm.run_hpo solar       -> LightGBM inside the container,
#   docker compose run --rm train-neural neural.train ...    -> LSTM/MLP, torch CPU build;
#                                                             both log to the same MLflow

x-train: &train
  profiles: [train]
  depends_on: [mlflow]
  environment:
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./data:/app/data
    - ./configs:/app/configs

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts localhost:5001,127.0.0.1:5001,mlflow:5000
    restart: unless-stopped

  train:
    <<: *train
    build:
      context: .
      target: lgbm

  train-neural:
    <<: *train
    build:
      context: .
      target: neural

volumes:
  mlflow-data:
